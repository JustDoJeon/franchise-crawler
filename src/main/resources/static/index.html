<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공정위 가맹사업 크롤러</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #888; line-height: 1.7; margin-bottom: 32px; }
    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #888;
      min-height: 24px;
    }
    .status.success { color: #22c55e; }
    .status.error   { color: #ef4444; }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #444;
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📊</div>
    <h1>공정위 가맹사업 크롤러</h1>
    <p>
      공정거래위원회 가맹사업 정보공개서<br>
      전체 목록을 엑셀 파일로 다운로드합니다.<br>
      데이터 양에 따라 수 분이 소요될 수 있어요.
    </p>
    <button id="btn" onclick="startCrawl()">📥 크롤링 시작 &amp; 다운로드</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    async function startCrawl() {
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');

      btn.disabled = true;
      status.className = 'status';
      status.innerHTML = '<span class="spinner"></span>크롤링 중... 잠시만 기다려주세요';

      try {
        const res = await fetch('/api/crawl', { method: 'POST' });
        if (!res.ok) throw new Error('서버 오류 ' + res.status);

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
        a.href = url;
        a.download = 'franchise_list_' + today + '.xlsx';
        a.click();
        URL.revokeObjectURL(url);

        status.className = 'status success';
        status.textContent = '✅ 다운로드 완료!';
      } catch (e) {
        status.className = 'status error';
        status.textContent = '❌ 실패: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
